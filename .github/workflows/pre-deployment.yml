# Pre-deployment smoke (a2a/07 CI)
# Запускает: pytest + docker build для обоих образов.
# Цель — поймать ошибки сборки до того, как они сломают развертку.

name: pre-deployment

on:
  push:
    branches: [main, feat/a2a-refactor]
  pull_request:
    branches: [main, feat/a2a-refactor]
  workflow_dispatch:        # ручной запуск перед разверткой

jobs:
  pytest:
    name: pytest (257 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[agent,dev]"
      - name: Run tests
        env:
          # Тесты не требуют LLM, .env не нужен. Заглушки — в conftest.py если есть.
          CHAT_URL: ""
          API_KEY: ""
        run: pytest -q

  docker-mcp:
    name: docker build (mcp)
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build mcp image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.mcp
          tags: blocksnet-mcp/mcp:ci-${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-agent:
    name: docker build (agent)
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agent
          tags: blocksnet-mcp/agent:ci-${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: compose smoke (если есть Docker)
    runs-on: ubuntu-latest
    needs: [docker-mcp, docker-agent]
    if: success()
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up -d
      - name: Wait healthchecks
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              echo "agent healthy"; break
            fi
            sleep 5
          done
      - name: Verify Agent Card
        run: |
          curl -fsS http://localhost:8080/.well-known/agent-card.json | jq -e '.skills | length >= 2'
      - name: Verify MCP import
        run: docker compose exec -T mcp python -c "import blocksnet_mcp.server; print('OK')"
      - name: Cleanup
        if: always()
        run: docker compose down
